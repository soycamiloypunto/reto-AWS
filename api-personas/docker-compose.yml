version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres-api-personas
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: apipersonas_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres-data:
