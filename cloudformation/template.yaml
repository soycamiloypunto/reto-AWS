AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Infraestructura de Usuarios (Fases 7) nativa usando CloudFormation (SAM)

Resources:
  # ------------------------------------------------------------------
  # 1. Base de Datos NoSQL (HU8)
  # ------------------------------------------------------------------
  UsuariosDynamoDBTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: api-usuarios-cfn-prod-usuarios
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # ------------------------------------------------------------------
  # 2. Mensajería y Eventos: SQS y SNS (HU9)
  # ------------------------------------------------------------------
  UsuariosQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: api-usuarios-cfn-prod-queue

  UsuariosTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: api-usuarios-cfn-prod-topic

  # ------------------------------------------------------------------
  # 3. Rol de Ejecución para las Lambdas (IAM)
  # ------------------------------------------------------------------
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: UsuariosLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: arn:aws:logs:*:*:*
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                Resource: !GetAtt UsuariosDynamoDBTable.Arn
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt UsuariosQueue.Arn
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref UsuariosTopic

  # ------------------------------------------------------------------
  # 4. Funciones Lambda (HU7)
  # ------------------------------------------------------------------
  CrearUsuarioFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: cfn-crearUsuario
      CodeUri: ../python-lambdas/
      Handler: usuarios_handler.crear
      Runtime: python3.9
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref UsuariosDynamoDBTable
          SQS_QUEUE_URL: !Ref UsuariosQueue
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            Path: /usuarios
            Method: post

  ObtenerUsuarioFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: cfn-obtenerUsuario
      CodeUri: ../python-lambdas/
      Handler: usuarios_handler.obtener
      Runtime: python3.9
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref UsuariosDynamoDBTable
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            Path: /usuarios/{id}
            Method: get

  EnviarCorreosFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: cfn-enviarCorreos
      CodeUri: ../python-lambdas/
      Handler: notificaciones_handler.procesar
      Runtime: python3.9
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref UsuariosTopic
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt UsuariosQueue.Arn
            BatchSize: 1

Outputs:
  ApiUrl:
    Description: "URL de la API Serverless de Usuarios (CloudFormation)"
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/usuarios"
  DynamoTableName:
    Description: "Nombre de la Tabla DynamoDB"
    Value: !Ref UsuariosDynamoDBTable
