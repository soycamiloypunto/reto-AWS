service: api-usuarios-serverless

provider:
  name: aws
  runtime: python3.9
  region: us-east-1
  stage: prod
  environment:
    DYNAMODB_TABLE: ${self:service}-${self:provider.stage}-usuarios
    SQS_QUEUE_URL: { Ref: UsuariosQueue }
    SNS_TOPIC_ARN: { Ref: UsuariosTopic }
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
          Resource: "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE}"
        - Effect: Allow
          Action:
            - sqs:SendMessage
          Resource:
            Fn::GetAtt: [UsuariosQueue, Arn]
        - Effect: Allow
          Action:
            - sns:Publish
          Resource:
            Ref: UsuariosTopic

functions:
  crearUsuario:
    handler: usuarios_handler.crear
    events:
      - httpApi:
          path: /usuarios
          method: post

  obtenerUsuario:
    handler: usuarios_handler.obtener
    events:
      - httpApi:
          path: /usuarios/{id}
          method: get

  enviarCorreos:
    handler: notificaciones_handler.procesar
    events:
      - sqs:
          arn:
            Fn::GetAtt: [UsuariosQueue, Arn]
          batchSize: 1

resources:
  Resources:
    UsuariosDynamoDBTable:
      Type: 'AWS::DynamoDB::Table'
      Properties:
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
        TableName: ${self:provider.environment.DYNAMODB_TABLE}
        
    UsuariosQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${self:provider.stage}-queue
        
    UsuariosTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: ${self:service}-${self:provider.stage}-topic
